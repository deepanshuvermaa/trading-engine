# INVESTOR RULES — authored from docs/INVESTOR_RULES_SPEC.md
# Every rule: testable condition + exact threshold. mutability per spec §10.4/§10.7 + Appendix:
#   IMMUTABLE = risk-engine veto, never searched/relaxed by the learning loop.
#   LEARNABLE = threshold may be mutated ONLY via loops/experiment.py A/B path.
version: 1
source: docs/INVESTOR_RULES_SPEC.md
rules:
  # ── 1. Buffett / Munger — Quality-Moat Value ──────────────────────────
  - {id: B1,  investor: "Buffett/Munger", name: "Consistent high ROE (moat proxy)", threshold: "ROE >= 15% in each of last 10 fiscal years", params: {roe_min: 0.15, years: 10}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B2,  investor: "Buffett/Munger", name: "High return on invested capital", threshold: "ROIC >= 12% avg over 10y", params: {roic_min: 0.12, years: 10}, mutability: LEARNABLE, confidence: MOD, category: fundamental_quality, sleeve: quality_value}
  - {id: B3,  investor: "Buffett/Munger", name: "Low leverage", threshold: "LT debt / net income <= 4.0 (alt debt/equity <= 0.5)", params: {debt_to_income_max: 4.0, debt_to_equity_max: 0.5}, mutability: LEARNABLE, confidence: MOD, category: fundamental_quality, sleeve: quality_value}
  - {id: B4,  investor: "Buffett/Munger", name: "Durable gross margin", threshold: "Gross margin >= 40% every year for 10y", params: {gross_margin_min: 0.40, years: 10}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B5,  investor: "Buffett/Munger", name: "SG&A discipline", threshold: "SG&A <= 30% of gross profit", params: {sga_to_gp_max: 0.30}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B6,  investor: "Buffett/Munger", name: "Low capital intensity", threshold: "Depreciation <= 10% of gross profit AND capex <= 50% of net income (10y avg)", params: {dep_to_gp_max: 0.10, capex_to_ni_max: 0.50}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B7,  investor: "Buffett/Munger", name: "Interest coverage", threshold: "Interest expense <= 15% of operating income", params: {int_to_opinc_max: 0.15}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B8,  investor: "Buffett/Munger", name: "Net margin", threshold: "Net margin >= 20% sustained", params: {net_margin_min: 0.20}, mutability: LEARNABLE, confidence: MOD, category: fundamental_quality, sleeve: quality_value}
  - {id: B9,  investor: "Buffett/Munger", name: "Owner earnings", threshold: "OE = NI + D&A + non-cash - maintenance_capex - dWC (proxy maint_capex = D&A)", params: {}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: quality_value}
  - {id: B10, investor: "Buffett/Munger", name: "Intrinsic value (two-stage DCF)", threshold: "g1 = min(10y OE CAGR, 15%) x 10y, g2 = 2.5%, r = max(10yT + 3%, 9%)", params: {g1_cap: 0.15, g2: 0.025, r_floor: 0.09, r_spread: 0.03}, mutability: LEARNABLE, confidence: MOD, category: valuation, sleeve: quality_value}
  - {id: B11, investor: "Buffett/Munger", name: "Margin of safety", threshold: "BUY <= 0.70 x IV; STRONG BUY <= 0.50 x IV; REJECT >= 1.10 x IV", params: {buy_mos: 0.70, strong_buy_mos: 0.50, reject_ratio: 1.10}, mutability: LEARNABLE, confidence: MOD, category: valuation, sleeve: quality_value}
  - {id: B12, investor: "Buffett/Munger", name: "Earnings predictability gate", threshold: "ln(EPS) 10y regression R^2 >= 0.80 AND <= 1 down-year > 10% decline", params: {r2_min: 0.80, max_down_years: 1, down_year_decline: 0.10}, mutability: LEARNABLE, confidence: MOD, category: fundamental_quality, sleeve: quality_value}
  - {id: B13, investor: "Buffett/Munger", name: "Retained-earnings test", threshold: "Rolling 5y dMarketCap >= sum(retained earnings 5y)", params: {years: 5}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B14, investor: "Buffett/Munger", name: "Buyback quality", threshold: "Buybacks positive only when Price < IV; above IV score negative", params: {}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: quality_value}
  - {id: B15, investor: "Buffett/Munger", name: "Never sell on price alone", threshold: "Exit only on B1/B4/B13 break or price >= 1.5 x IV; no stop-loss on this sleeve", params: {sell_ratio: 1.5}, mutability: LEARNABLE, confidence: MOD, category: exit, sleeve: quality_value}
  - {id: B16, investor: "Buffett/Munger", name: "Punch-card concentration", threshold: "Max 5-10 positions in quality sleeve; min position 10% of sleeve if all filters pass", params: {max_positions: 10, min_position_pct: 10}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: quality_value}
  # ── Munger anti-bias mechanics ────────────────────────────────────────
  - {id: M1, investor: "Munger", name: "Incentive-caused bias screen", threshold: "Insider ownership >= 5% OR comp >= 50% tied to ROIC/EPS; REJECT if SBC > 5% of revenue", params: {insider_min: 0.05, sbc_to_rev_max: 0.05}, mutability: LEARNABLE, confidence: MOD, category: governance, sleeve: quality_value}
  - {id: M2, investor: "Munger", name: "Forced re-underwrite", threshold: "Every position re-scored from scratch every 90 days, entry thesis hidden", params: {days: 90}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: M3, investor: "Munger", name: "Cost-basis blindness", threshold: "Entry price must NOT be an input to hold/exit logic (except explicit stop rules)", params: {}, mutability: IMMUTABLE, confidence: MOD, category: risk_veto, sleeve: all}
  - {id: M4, investor: "Munger", name: "Crowding filter", threshold: "REJECT if short interest > 20% squeeze / >5% of 13F top-10s; crypto funding > 0.1%/8h = crowded long", params: {funding_max_8h: 0.001, short_interest_max: 0.20, thirteen_f_max: 0.05}, mutability: IMMUTABLE, confidence: MOD, category: risk_veto, sleeve: all}
  - {id: M5, investor: "Munger", name: "Base-rate anchor", threshold: "Shrink any forecast input 50% toward 20y asset-class base rate", params: {shrink: 0.50}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: M6, investor: "Munger", name: "Pre-mortem kill-list", threshold: "Entry requires stored failure checklist, each condition with measurable trigger", params: {}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: M7, investor: "Munger", name: "Lollapalooza confluence", threshold: "Size scales only when >= 3 independent factor families agree", params: {min_factors: 3}, mutability: LEARNABLE, confidence: MOD, category: conviction, sleeve: all}
  # ── 2. Graham — Deep Value ────────────────────────────────────────────
  - {id: G1,  investor: "Graham", name: "NCAV definition", threshold: "NCAV = Current Assets - Total Liabilities - Preferred", params: {}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: G2,  investor: "Graham", name: "Net-net buy price", threshold: "Price <= 0.667 x NCAV per share", params: {ncav_ratio: 0.667}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: G3,  investor: "Graham", name: "Net-net quality overlay", threshold: "Positive TTM earnings AND paying any dividend", params: {}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G4,  investor: "Graham", name: "Net-net diversification floor", threshold: ">= 30 simultaneous net-nets, equal-weight; single name <= 3.3% of sleeve", params: {min_positions: 30, max_name_pct: 3.3}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: deep_value}
  - {id: G5,  investor: "Graham", name: "Net-net exit", threshold: "Sell at Price >= NCAV or after 2 years, whichever first", params: {max_hold_years: 2}, mutability: LEARNABLE, confidence: HIGH, category: exit, sleeve: deep_value}
  - {id: G6,  investor: "Graham", name: "Graham Number ceiling", threshold: "GN = sqrt(22.5 x EPS_ttm x BVPS); buy zone Price <= GN", params: {multiplier: 22.5}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: G7,  investor: "Graham", name: "Adequate size", threshold: "Revenue >= $700M or market cap >= $2B (2026-adjusted)", params: {revenue_min: 700000000, mcap_min: 2000000000}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G8,  investor: "Graham", name: "Financial condition", threshold: "Current ratio >= 2.0 AND LT debt <= net current assets", params: {current_ratio_min: 2.0}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G9,  investor: "Graham", name: "Earnings stability", threshold: "Positive EPS in every one of the last 10 years", params: {years: 10}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G10, investor: "Graham", name: "Dividend record", threshold: "Uninterrupted dividends 20 consecutive years", params: {years: 20}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G11, investor: "Graham", name: "Earnings growth", threshold: "(avg EPS yrs 8-10)/(avg EPS yrs 1-3) >= 1.33", params: {growth_min: 1.33}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: G12, investor: "Graham", name: "Moderate P/E", threshold: "Price <= 15 x avg EPS of trailing 3 years", params: {pe_max: 15}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: G13, investor: "Graham", name: "Moderate P/B", threshold: "P/B <= 1.5 or P/E x P/B <= 22.5", params: {pb_max: 1.5, pe_pb_max: 22.5}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR1,  investor: "Graham", name: "Graham-Rea earnings yield", threshold: "Earnings yield >= 2 x AAA bond yield", params: {aaa_mult: 2.0}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR2,  investor: "Graham", name: "Graham-Rea P/E vs own history", threshold: "P/E <= 40% of stock's own 5y-high P/E", params: {ratio_max: 0.40}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR3,  investor: "Graham", name: "Graham-Rea dividend yield", threshold: "Dividend yield >= 2/3 x AAA bond yield", params: {aaa_mult: 0.667}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR4,  investor: "Graham", name: "Graham-Rea tangible book", threshold: "Price <= 2/3 x tangible book value per share", params: {tbv_ratio: 0.667}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR5,  investor: "Graham", name: "Graham-Rea NCAV", threshold: "Price <= 2/3 x NCAV per share", params: {ncav_ratio: 0.667}, mutability: LEARNABLE, confidence: HIGH, category: valuation, sleeve: deep_value}
  - {id: GR6,  investor: "Graham", name: "Graham-Rea debt vs book", threshold: "Total debt < book value", params: {}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: GR7,  investor: "Graham", name: "Graham-Rea current ratio", threshold: "Current ratio >= 2", params: {current_ratio_min: 2.0}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: GR8,  investor: "Graham", name: "Graham-Rea debt vs NCAV", threshold: "Total debt <= 2 x NCAV", params: {ncav_mult: 2.0}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: GR9,  investor: "Graham", name: "Graham-Rea EPS growth", threshold: "10y EPS CAGR >= 7%", params: {cagr_min: 0.07}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  - {id: GR10, investor: "Graham", name: "Graham-Rea EPS stability", threshold: "<= 2 YoY EPS declines of >= 5% in past 10 years", params: {max_declines: 2, decline_pct: 0.05}, mutability: LEARNABLE, confidence: HIGH, category: fundamental_quality, sleeve: deep_value}
  # ── 3. Livermore — Pivotal Points ─────────────────────────────────────
  - {id: L1,  investor: "Livermore", name: "Line of least resistance", threshold: "Long only in uptrend (higher highs/lows); short only inverse. Never counter-trend", params: {}, mutability: LEARNABLE, confidence: HIGH, category: trend, sleeve: momentum_breakout}
  - {id: L2,  investor: "Livermore", name: "Pivotal point entry", threshold: "Pivot(long) = 52-week / consolidation range high; entry on close > pivot", params: {lookback_weeks: 52}, mutability: LEARNABLE, confidence: HIGH, category: entry, sleeve: momentum_breakout}
  - {id: L3,  investor: "Livermore", name: "Continuation pivotal point", threshold: "Consolidation >= 3 weeks with range <= 15%; breakout = re-entry/add point", params: {min_weeks: 3, range_max_pct: 15}, mutability: LEARNABLE, confidence: MOD, category: entry, sleeve: momentum_breakout}
  - {id: L4,  investor: "Livermore", name: "Market Key swing filter", threshold: "Swing filter = max(2.5 x ATR20, 6% of price); natural reaction = counter-move of that magnitude", params: {atr_mult: 2.5, pct_floor: 6}, mutability: LEARNABLE, confidence: HIGH, category: trend, sleeve: momentum_breakout}
  - {id: L5,  investor: "Livermore", name: "Confirmation / penetration", threshold: "Breakout confirmed only when price penetrates pivot by >= max(0.5 x ATR20, 1%)", params: {atr_mult: 0.5, pct_floor: 1}, mutability: LEARNABLE, confidence: HIGH, category: entry, sleeve: momentum_breakout}
  - {id: L6,  investor: "Livermore", name: "Abnormal reaction exit", threshold: "Fall back below pivot within confirmation window = FALSE move -> exit full size immediately", params: {}, mutability: LEARNABLE, confidence: HIGH, category: exit, sleeve: momentum_breakout}
  - {id: L7,  investor: "Livermore", name: "Time stop (acting right)", threshold: "If position not profitable within 3 sessions of entry, cut it", params: {sessions: 3}, mutability: LEARNABLE, confidence: MOD, category: exit, sleeve: momentum_breakout}
  - {id: L8,  investor: "Livermore", name: "Probe-and-pyramid sizing", threshold: "Tranches 20/20/20/40%; add only at higher prices (>= prior fill + 0.5 x ATR); if tranche 1 loses never add", params: {tranches: [0.2, 0.2, 0.2, 0.4], add_atr: 0.5}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: momentum_breakout}
  - {id: L9,  investor: "Livermore", name: "Never average down", threshold: "Adding to a losing position is prohibited — hard risk-engine veto", params: {}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: all}
  - {id: L10, investor: "Livermore", name: "10% bucket-shop stop", threshold: "Max loss on any single trade = 10% of position value — absolute ceiling", params: {max_loss_pct: 10}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: all}
  - {id: L11, investor: "Livermore", name: "50% retracement signal", threshold: "Reversal from 50% retracement level in trend direction = re-entry; decisive break beyond = trend over", params: {retrace: 0.50}, mutability: LEARNABLE, confidence: HIGH, category: entry, sleeve: momentum_breakout}
  - {id: L12, investor: "Livermore", name: "Profit reserve", threshold: "Sweep 50% of realized profit of a winning campaign to non-tradable reserve", params: {sweep: 0.50}, mutability: LEARNABLE, confidence: HIGH, category: process, sleeve: all}
  - {id: L13, investor: "Livermore", name: "Sit tight — trend-break exit only", threshold: "Winners exited only on L4-scale reversal or trailing swing-low break, never fixed target", params: {}, mutability: LEARNABLE, confidence: HIGH, category: exit, sleeve: momentum_breakout}
  # ── 4. Druckenmiller / Soros ──────────────────────────────────────────
  - {id: D1,  investor: "Druckenmiller/Soros", name: "Liquidity master signal", threshold: "Net Fed liquidity 13-wk change > 0 (crypto: stablecoin mcap 30d change > 0 AND M2 YoY rising)", params: {weeks: 13}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: macro_directional}
  - {id: D2,  investor: "Druckenmiller/Soros", name: "Reflexivity boom detector", threshold: "12m ROC > +20% AND fundamental accelerating -> ride, do NOT short", params: {roc_min: 20}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: macro_directional}
  - {id: D3,  investor: "Druckenmiller/Soros", name: "Reflexivity bust detector", threshold: "New 6m price high unconfirmed by fundamentals 2 quarters AND break of 20-wk MA -> short/exit", params: {quarters: 2}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: macro_directional}
  - {id: D4,  investor: "Druckenmiller/Soros", name: "Asymmetry filter", threshold: "Enter only if reward:risk >= 3:1 (macro sleeve)", params: {rr_min: 3.0}, mutability: IMMUTABLE, confidence: MOD, category: risk_veto, sleeve: macro_directional}
  - {id: D5,  investor: "Druckenmiller/Soros", name: "Probe first", threshold: "Initial position 25% of intended; scale full only after price moves >= 1 ATR in favor", params: {probe: 0.25, confirm_atr: 1.0}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: macro_directional}
  - {id: D6,  investor: "Druckenmiller/Soros", name: "Bet big on confluence", threshold: "Fundamental + technical + liquidity aligned -> position may reach 20-30% of book risk-weighted", params: {max_book_pct: 30}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: macro_directional}
  - {id: D7,  investor: "Druckenmiller/Soros", name: "Never fight a strong trend", threshold: "Block counter-trend entries when |price-200dMA|/200dMA > 20% AND ADX(14) > 30 in trend direction", params: {ma_dist_pct: 20, adx_min: 30}, mutability: LEARNABLE, confidence: MOD, category: trend, sleeve: all}
  - {id: D8,  investor: "Druckenmiller/Soros", name: "Drawdown circuit breaker", threshold: "Monthly -5% -> cut gross 50%; -10% -> flat + 2-week cooloff, restart 25% gross", params: {cut_dd_pct: 5, flat_dd_pct: 10, cooloff_weeks: 2, restart_gross: 0.25}, mutability: IMMUTABLE, confidence: MOD, category: risk_veto, sleeve: all}
  - {id: D9,  investor: "Druckenmiller/Soros", name: "House-money pressing", threshold: "Gross cap: base 100%; YTD > +10% -> 150%; YTD < 0 -> 70%", params: {base: 100, up_cap: 150, down_cap: 70, ytd_up: 10}, mutability: IMMUTABLE, confidence: MOD, category: risk_veto, sleeve: all}
  - {id: D10, investor: "Druckenmiller/Soros", name: "Thesis invalidation stop", threshold: "Stored invalidation hit = exit, no debate; no same-direction re-entry for 5 sessions", params: {reentry_ban_sessions: 5}, mutability: LEARNABLE, confidence: HIGH, category: exit, sleeve: all}
  - {id: D11, investor: "Druckenmiller/Soros", name: "Central-bank pivot trade", threshold: "2y yield 20d change crossing zero = highest-weight macro input for FX/rates/crypto", params: {days: 20}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: macro_directional}
  # ── 5. Simons / Renaissance — Signal Hygiene ──────────────────────────
  - {id: S1,  investor: "Simons", name: "Many small edges", threshold: ">= 20 concurrent independent signals; no single signal > 10% of risk budget", params: {min_signals: 20, max_signal_risk_pct: 10}, mutability: LEARNABLE, confidence: HIGH, category: portfolio, sleeve: stat_arb}
  - {id: S2,  investor: "Simons", name: "Short holding periods", threshold: "Median intended holding period <= 5 days for the stat sleeve", params: {median_days_max: 5}, mutability: LEARNABLE, confidence: HIGH, category: portfolio, sleeve: stat_arb}
  - {id: S3,  investor: "Simons", name: "Signal admission test", threshold: "Backtest t-stat >= 3.0 (or PSR >= 0.95) AND OOS Sharpe >= 0.5 x IS AND survives 2x cost model", params: {t_stat_min: 3.0, psr_min: 0.95, oos_ratio: 0.5, cost_mult: 2.0}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: S4,  investor: "Simons", name: "Never override the model", threshold: "Manual intervention only via kill-switch (flatten); no order path outside signal pipeline", params: {}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: all}
  - {id: S5,  investor: "Simons", name: "Kill decaying signals", threshold: "Retire when 90d Sharpe < 0 AND 252d Sharpe < 0.3, or CUSUM rejects at 95%; quarantine 90d then re-pass S3", params: {sharpe_90d: 0.0, sharpe_252d: 0.3, quarantine_days: 90}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: S6,  investor: "Simons", name: "Correlation caps", threshold: "Pairwise 90d signal P&L correlation <= 0.7; if breached halve the lower-Sharpe one", params: {corr_max: 0.7}, mutability: LEARNABLE, confidence: MOD, category: portfolio, sleeve: all}
  - {id: S7,  investor: "Simons", name: "Cost-aware execution", threshold: "Expected edge per trade > 2 x (spread/2 + fee + impact k x (size/ADV)^0.5)", params: {cost_mult: 2.0}, mutability: LEARNABLE, confidence: MOD, category: execution, sleeve: all}
  - {id: S8,  investor: "Simons", name: "Persistence over explanation", threshold: "No-rationale signal gets half risk budget; both need persistence across >= 2 sub-periods and >= 2 instruments", params: {min_subperiods: 2, min_instruments: 2}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
  - {id: S9,  investor: "Simons", name: "Book-level vol targeting", threshold: "Scale gross so realized 20d portfolio vol -> ~15% annualized; recompute daily", params: {vol_target: 0.15, window_days: 20}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: all}
  - {id: S10, investor: "Simons", name: "Data integrity first", threshold: "Quarantine bars failing sanity checks (jump > 20 sigma, negative volume, stale timestamp); never fire on unvalidated data", params: {jump_sigma: 20}, mutability: LEARNABLE, confidence: HIGH, category: data, sleeve: all}
  # ── 6. Dalio — Regime + Risk Parity ───────────────────────────────────
  - {id: R1,  investor: "Dalio", name: "Growth axis", threshold: "GROWTH_UP if >= 2 of 3: ISM > 50 rising; claims 13-wk change < 0; GDP nowcast > consensus", params: {votes_needed: 2}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: allocation}
  - {id: R2,  investor: "Dalio", name: "Inflation axis", threshold: "INFL_UP if >= 2 of 3: CPI 3m momentum > 0; 10y breakeven 3m change > +10bp; BCOM > 200d MA", params: {votes_needed: 2, breakeven_bp: 10}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: allocation}
  - {id: R3,  investor: "Dalio", name: "Quadrant asset tilt", threshold: "Each quadrant 25% of risk, tilted +50%/-50% by detected quadrant", params: {tilt: 0.50}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: allocation}
  - {id: R4,  investor: "Dalio", name: "Regime persistence filter", threshold: "Quadrant must persist 2 consecutive monthly reads before weights shift", params: {reads: 2}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: allocation}
  - {id: R5,  investor: "Dalio", name: "Debt-cycle overlay", threshold: "Credit/GDP 5y change > +15pp AND debt-service rising -> cap gross 75%, raise Q3/Q4 weights", params: {credit_gdp_pp: 15, gross_cap: 75}, mutability: LEARNABLE, confidence: MOD, category: macro, sleeve: allocation}
  - {id: R6,  investor: "Dalio", name: "Naive risk parity", threshold: "weight_i = (1/sigma_i)/sum(1/sigma_j), sigma = 60d realized vol EWMA lambda 0.94", params: {window: 60, ewma_lambda: 0.94}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: allocation}
  - {id: R7,  investor: "Dalio", name: "Equal risk contribution", threshold: "Solve w so each RC = (1/N) total; rebalance monthly or on > 20% RC drift", params: {drift_pct: 20}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: allocation}
  - {id: R8,  investor: "Dalio", name: "Vol-target leverage", threshold: "Target 10-12% annualized vol; leverage cap 2.0x (crypto sleeve 1.0x)", params: {vol_lo: 0.10, vol_hi: 0.12, lev_cap: 2.0, crypto_lev_cap: 1.0}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: allocation}
  - {id: R9,  investor: "Dalio", name: "All Weather static fallback", threshold: "Pipeline degraded -> 30% eq / 40% long bonds / 15% int bonds / 7.5% gold / 7.5% commodities", params: {}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: allocation}
