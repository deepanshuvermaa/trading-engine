  # ── 8. Thorp — Kelly ──────────────────────────────────────────────────
  - {id: K1, investor: "Thorp", name: "Discrete Kelly", threshold: "f* = (b*p - q)/b from rolling stats (min 50 trades)", params: {min_trades: 50}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: all}
  - {id: K2, investor: "Thorp", name: "Continuous Kelly", threshold: "f* = (mu - r)/sigma^2", params: {}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: all}
  - {id: K3, investor: "Thorp", name: "Multi-asset Kelly", threshold: "f = Sigma^-1 (mu - r), Ledoit-Wolf shrunk covariance", params: {}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: all}
  - {id: K4, investor: "Thorp", name: "Fractional Kelly cap", threshold: "Bet 0.25 x f* for signals < 1y live, 0.50 x f* seasoned. Never > 0.5 Kelly", params: {young_frac: 0.25, seasoned_frac: 0.50, hard_cap: 0.50}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: all}
  - {id: K5, investor: "Thorp", name: "Edge shrinkage before Kelly", threshold: "Shrink estimated mu (or p) 50% toward zero (or 50%) before computing f*", params: {shrink: 0.50, shrink_lo: 0.40, shrink_hi: 0.60}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: all}
  - {id: K6, investor: "Thorp", name: "Drawdown math constraint", threshold: "At fraction c, P(drop to x of peak) = x^(2/c - 1); choose c for D_max (20% -> c ~ 0.36)", params: {d_max: 0.20, c_for_20pct: 0.36}, mutability: LEARNABLE, confidence: HIGH, category: sizing, sleeve: all}
  - {id: K7, investor: "Thorp", name: "Per-position risk cap", threshold: "No position > 2% risk of equity for stat-arb sleeves; concentrated macro only via D6 confluence", params: {risk_pct_max: 2.0}, mutability: IMMUTABLE, confidence: HIGH, category: risk_veto, sleeve: stat_arb}
  - {id: K8, investor: "Thorp", name: "Correlated-bet reduction", threshold: "Pairwise rho > 0.5 -> treat as one bet: sum Kelly fractions, cap at single-bet f*", params: {rho_max: 0.5}, mutability: LEARNABLE, confidence: MOD, category: sizing, sleeve: all}
  - {id: K9, investor: "Thorp", name: "Recompute cadence", threshold: "Re-estimate p, b, mu, sigma on rolling 100-trade / 252-day window; update only at rebalance", params: {trades_window: 100, days_window: 252}, mutability: LEARNABLE, confidence: MOD, category: process, sleeve: all}
